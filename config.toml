[server]
port = 19847
session_timeout_secs = 0
max_fps = 10
jpeg_quality = 70

[security]
# This repository file is a template only. Generate real values with:
#   cargo run --bin keygen
discovery_cookie = "CHANGE_ME_32_HEX_CHARS_FROM_KEYGEN"
private_key = "CHANGE_ME_64_HEX_CHARS_FROM_KEYGEN"
cardputer_public_key = "CHANGE_ME_66_HEX_CHARS_FROM_KEYGEN"

[network]
mdns_service_name = "CardputerRemote"
device_name = "PC"
bind_address = "127.0.0.1"

[display]
target_width = 240
target_height = 135

[logging]
level = "info"
json_format = false

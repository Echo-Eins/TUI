[general]
app_name = "TUI+"
refresh_rate_ms = 1000
compact_mode = false
theme = "dark"

[tabs]
enabled = [
    "cpu",
    "gpu",
    "ram",
    "disk",
    "network",
    "ollama",
    "processes",
    "services",
    "disk_analyzer",
    "settings",
]
default = "cpu"

[monitors.cpu]
enabled = true
refresh_interval_ms = 1000
show_per_core = true
show_frequency = true
show_temperature = true
top_processes_count = 8

[monitors.gpu]
enabled = true
refresh_interval_ms = 1500
use_nvml = true
show_processes = true
show_memory = true
top_processes_count = 8

[monitors.ram]
enabled = true
refresh_interval_ms = 1500
show_breakdown = true
show_pagefile = true
top_processes_count = 10

[monitors.disk]
enabled = true
refresh_interval_ms = 3000
show_health = true
show_temperature = true
show_activity = true

[monitors.network]
enabled = true
refresh_interval_ms = 1000
show_graph = true
graph_duration_seconds = 60
show_connections = true
max_connections = 100

[monitors.processes]
enabled = true
refresh_interval_ms = 2000

[monitors.services]
enabled = true
refresh_interval_ms = 3000

[integrations.ollama]
enabled = true
refresh_interval_ms = 3000
command_timeout_seconds = 120
show_vram_usage = true

[integrations.everything]
enabled = true
es_executable = "es.exe"
max_depth = 2
refresh_interval_ms = 5000

[ui]
mouse_support = true
tab_switch_key = "Tab"
compact_toggle_key = "c"
command_menu_key = "Ctrl+f"
quit_key = "Ctrl+c"

[ui.graphs]
width = 60
height = 10

[ui.command_history]
max_entries = 100
circular_menu_radius = 10

[ui.section_highlight]
variant = "brackets"
normal_bracket = "square"
highlighted_bracket = "round"
normal_color = "white"
highlighted_color = "yellow"

[hotkeys]
cpu = "1"
gpu = "2"
ram = "3"
disk = "4"
network = "5"
ollama = "6"
processes = "7"
services = "8"
disk_analyzer = "9"
settings = "0"

[powershell]
executable = "powershell"
timeout_seconds = 10
use_cache = true
cache_ttl_seconds = 5

[theme.dark]
background = "black"
foreground = "white"
cpu_color = "cyan"
gpu_color = "magenta"
ram_color = "green"
disk_color = "yellow"
network_color = "blue"
warning_color = "yellow"
error_color = "red"
success_color = "green"
